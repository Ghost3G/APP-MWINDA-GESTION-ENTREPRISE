{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupe Agence Mwinda</title>
    {% include "partials/head_styles.html" %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Sora", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background:
                radial-gradient(900px 480px at 18% -8%, rgba(94, 234, 212, 0.12), transparent 55%),
                radial-gradient(700px 420px at 90% 10%, rgba(125, 211, 252, 0.1), transparent 50%),
                linear-gradient(180deg, #101a2b 0%, #0b1220 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            animation: loginRise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes loginRise {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: linear-gradient(165deg, rgba(94, 234, 212, 0.06), transparent 40%), #152033;
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 24px 70px rgba(2, 8, 23, 0.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-container {
            margin-bottom: 16px;
        }

        .logo-container img {
            height: 48px;
            width: auto;
            filter: brightness(0) invert(1);
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #f5f5f7;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #a1a1a6;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #f5f5f7;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
            background: #0f172a;
            color: #f5f5f7;
        }

        .form-group input:focus {
            outline: none;
            border-color: #5eead4;
            box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.14);
        }

        .form-group input::placeholder {
            color: #6e6e73;
        }

        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            padding: 12px 14px;
            background: linear-gradient(135deg, #5eead4, #2dd4bf);
            color: #042f2e;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.04);
            box-shadow: 0 12px 24px rgba(45, 212, 191, 0.28);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .forgot-password {
            text-align: center;
            margin-top: 16px;
        }

        .forgot-password a {
            color: #5eead4;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-container">
                    <img src="{% static 'images/logo_agence_noir.png' %}" alt="AppMwinda">
                </div>
                <h1>Bienvenue</h1>
                <p>Plateforme de gestion Agence Mwinda — projets, équipes et opérations.</p>
            </div>

            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Votre nom d'utilisateur"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Votre mot de passe"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">Se connecter</button>
            </form>

            <div class="forgot-password">
                <a href="#">Mot de passe oublié ?</a>
            </div>
        </div>
    </div>
</body>
</html>
