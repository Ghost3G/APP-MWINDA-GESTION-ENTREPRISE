{% if service_hours %}
<div class="service-hours-banner" role="note" aria-label="Horaires de service">
    <div class="service-hours-banner__inner">
        <span class="service-hours-banner__badge">Horaires de service</span>
        <div class="service-hours-banner__slots">
            <span class="service-hours-banner__slot">
                <strong>Lun – Ven</strong>
                <em>08:30 – 17:30</em>
            </span>
            <span class="service-hours-banner__sep" aria-hidden="true">·</span>
            <span class="service-hours-banner__slot">
                <strong>Samedi</strong>
                <em>09:00 – 13:00</em>
            </span>
            <span class="service-hours-banner__sep" aria-hidden="true">·</span>
            <span class="service-hours-banner__slot service-hours-banner__slot--today {% if not service_hours.today_open %}is-closed{% endif %}">
                <strong>Aujourd’hui ({{ service_hours.today_name }})</strong>
                {% if service_hours.today_open %}
                    <em>{{ service_hours.today_short }}</em>
                {% else %}
                    <em>Fermé</em>
                {% endif %}
            </span>
        </div>
    </div>
</div>
<style>
.service-hours-banner {
    width: 100%;
    background: #111111;
    border-bottom: 1px solid rgba(253, 224, 71, 0.35);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    z-index: 45;
}
.service-hours-banner__inner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px 18px;
    padding: 9px 14px;
    color: #f8fafc;
}
.service-hours-banner__badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 999px;
    background: #fde047;
    color: #111111;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
}
.service-hours-banner__slots {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 12px;
    font-size: 13px;
    font-weight: 700;
}
.service-hours-banner__slot {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    white-space: nowrap;
}
.service-hours-banner__slot strong {
    font-weight: 700;
    color: #a3a3a3;
}
.service-hours-banner__slot em {
    font-style: normal;
    font-weight: 900;
    font-size: 15px;
    color: #fde047;
    letter-spacing: 0.02em;
}
.service-hours-banner__slot--today {
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(253, 224, 71, 0.12);
    border: 1px solid rgba(253, 224, 71, 0.55);
}
.service-hours-banner__slot--today strong {
    color: #e5e5e5;
}
.service-hours-banner__slot--today.is-closed {
    background: rgba(239, 68, 68, 0.12);
    border-color: rgba(248, 113, 113, 0.45);
}
.service-hours-banner__slot--today.is-closed em {
    color: #fca5a5;
}
.service-hours-banner__sep {
    color: rgba(163, 163, 163, 0.7);
    font-weight: 400;
}
@media (max-width: 720px) {
    .service-hours-banner__inner {
        padding: 10px 12px;
        gap: 8px;
    }
    .service-hours-banner__sep {
        display: none;
    }
    .service-hours-banner__slots {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
    }
    .service-hours-banner__slot {
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .service-hours-banner__slot:last-child {
        border-bottom: 0;
    }
    .service-hours-banner__slot--today {
        border-radius: 10px;
        justify-content: space-between;
    }
}
</style>
{% endif %}
