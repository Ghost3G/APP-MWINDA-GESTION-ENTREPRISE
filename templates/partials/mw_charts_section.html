{% if mw_charts %}
<section class="mw-charts-section" aria-label="Indicateurs visuels">
    <div class="mw-charts-grid">
        {% for chart in mw_charts %}
            <article class="mw-wave-card{% if chart.wide %} mw-wave-card--wide{% endif %}">
                <header class="mw-wave-card__head">
                    <div>
                        <h3>{{ chart.title }}</h3>
                        {% if chart.subtitle %}
                            <span class="mw-wave-card__subtitle">{{ chart.subtitle }}</span>
                        {% endif %}
                    </div>
                </header>
                <div id="mw-wave-{{ chart.id }}" class="mw-wave-host" data-chart-id="{{ chart.id }}"></div>
            </article>
        {% endfor %}
    </div>
</section>
{% endif %}
