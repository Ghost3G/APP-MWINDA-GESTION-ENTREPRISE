{% load static %}
{% if agent_logout_warning.enabled %}
<div
    id="logoutCountdownBanner"
    class="logout-countdown-banner"
    hidden
    data-enabled="1"
    data-warn-label="{{ agent_logout_warning.warn_label }}"
    data-logout-label="{{ agent_logout_warning.logout_label }}"
    data-server-now="{{ agent_logout_warning.server_now_iso }}"
    data-warn-at="{{ agent_logout_warning.warn_at_iso }}"
    data-logout-at="{{ agent_logout_warning.logout_at_iso }}"
    role="alert"
    aria-live="polite"
>
    <div class="logout-countdown-banner__inner">
        <strong>Alerte déconnexion</strong>
        <span>
            Vous serez automatiquement déconnecté à
            <em>{{ agent_logout_warning.logout_label }}</em>.
            Temps restant :
            <span id="logoutCountdownValue">--:--</span>
        </span>
    </div>
</div>
<style>
.logout-countdown-banner {
    position: sticky;
    top: 0;
    z-index: 1200;
    background: linear-gradient(90deg, #7f1d1d, #b91c1c 55%, #ea580c);
    color: #fff7ed;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 24px rgba(127, 29, 29, 0.35);
}
.logout-countdown-banner__inner {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    justify-content: center;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
}
.logout-countdown-banner__inner strong {
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 12px;
    background: rgba(0, 0, 0, 0.22);
    padding: 4px 8px;
    border-radius: 999px;
}
.logout-countdown-banner__inner em {
    font-style: normal;
    font-weight: 800;
    color: #fef08a;
}
#logoutCountdownValue {
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    color: #fff;
    background: rgba(0, 0, 0, 0.28);
    padding: 2px 8px;
    border-radius: 6px;
}
</style>
<script src="{% static 'js/logout-countdown.js' %}?v=20260805a"></script>
{% endif %}
