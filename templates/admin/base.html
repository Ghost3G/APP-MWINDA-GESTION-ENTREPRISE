{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin - AppMwinda{% endblock %}</title>
    {% include "partials/head_styles.html" %}
    <style>
        .admin-page {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .admin-page h2 {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 20px;
        }

        .admin-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
        }

        .admin-header-row h2 {
            margin: 0;
        }

        .admin-stats,
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .admin-stat-card,
        .stat-card {
            background: linear-gradient(135deg, #fde047 0%, #fcd34d 100%);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(253, 224, 71, 0.15);
        }

        .admin-stat-card h3,
        .stat-card h3 {
            font-size: 12px;
            font-weight: 600;
            color: #111827;
            text-transform: uppercase;
            margin: 0 0 8px 0;
            opacity: 0.8;
        }

        .admin-stat-card .value,
        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: #111827;
        }

        .admin-table-section {
            margin-top: 24px;
            overflow-x: auto;
        }

        .admin-table-header {
            margin-bottom: 12px;
        }

        .admin-table,
        .admin-table-section table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .admin-table thead,
        .admin-table-section thead {
            background: #f3f4f6;
            border-bottom: 2px solid #e5e7eb;
        }

        .admin-table th,
        .admin-table-section th {
            padding: 14px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-table td,
        .admin-table-section td {
            padding: 14px;
            border-bottom: 1px solid #f3f4f6;
            vertical-align: middle;
        }

        .admin-btn,
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            text-decoration: none;
            display: inline-block;
        }

        .admin-btn-primary,
        .btn-primary {
            background: #fde047;
            color: #111827;
        }

        .admin-btn-danger,
        .btn-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .admin-btn-secondary,
        .btn-secondary {
            background: #dbeafe;
            color: #0c4a6e;
        }

        .admin-badge,
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .admin-badge-success,
        .badge-success {
            background: #dcfce7;
            color: #166534;
        }

        .admin-badge-warning,
        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .admin-badge-danger,
        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .admin-badge-info,
        .badge-info {
            background: #dbeafe;
            color: #0c4a6e;
        }

        .admin-form,
        .form-group {
            margin-bottom: 16px;
        }

        .admin-form {
            background: #f9fafb;
            padding: 20px;
            border-radius: 12px;
        }

        .admin-form-group,
        .form-group {
            margin-bottom: 16px;
        }

        .admin-form-group label,
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #374151;
            font-size: 13px;
        }

        .admin-form-group input,
        .admin-form-group select,
        .admin-form-group textarea,
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }

        .admin-form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .action-cell {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @media (max-width: 768px) {
            .admin-page {
                padding: 16px;
            }

            .admin-header-row,
            .admin-form-row {
                grid-template-columns: 1fr;
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-table-section,
            .admin-page {
                overflow-x: auto;
            }

            .admin-btn,
            .btn {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .admin-stats,
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .admin-table th,
            .admin-table td,
            .admin-table-section th,
            .admin-table-section td {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    {% include "partials/app_header.html" %}

    <div class="app-shell">
        <aside class="sidebar-panel">
            <div class="sidebar-brand">
                <img src="{% static 'images/logo_agence_noir.png' %}" alt="Logo" style="height: 28px; width: auto;">
                <span>AppMwinda Admin</span>
            </div>
            <nav class="sidebar-nav admin-nav">
                <a href="{% url 'admin_dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">Tableau de bord</a>
                <a href="{% url 'admin_users' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_users' %}active{% endif %}">Utilisateurs</a>
                <a href="{% url 'admin_projects' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_projects' %}active{% endif %}">Projets</a>
                <a href="{% url 'admin_messages' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_messages' %}active{% endif %}">Messages</a>
                <a href="{% url 'admin_reports' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_reports' %}active{% endif %}">Rapports</a>
                <a href="{% url 'admin_audit_logs' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_audit_logs' %}active{% endif %}">Audit Logs</a>
                <a href="{% url 'dashboard' %}" class="nav-item logout">Retour à l'app</a>
            </nav>
        </aside>

        <main class="dashboard-content">
            <div class="content-wrapper">
                <div class="admin-page">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </main>
    </div>
</body>
</html>
