{% extends "crm/base.html" %}
{% block crm_content %}
<div class="panel">
    <h3>Nouveau projet client</h3>
    <form method="POST">
        {% csrf_token %}
        <input type="hidden" name="action" value="add_project">
        <div class="form-grid two-cols">
            <div class="form-group">
                <label>Client *</label>
                <select name="client_id" required>
                    <option value="">— Choisir un client —</option>
                    {% for c in active_clients_for_project %}
                        <option value="{{ c.id }}" {% if request.GET.client == c.id|stringformat:"s" %}selected{% endif %}>
                            {% if c.code %}{{ c.code }} — {% endif %}{{ c.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Nom du projet *</label>
                <input type="text" name="project_name" required placeholder="Ex: Enseigne boutique X">
            </div>
            <div class="form-group">
                <label>Montant contrat ($)</label>
                <input type="text" name="project_amount" placeholder="Ex: 5000">
            </div>
            <div class="form-group">
                <label>Direction / branche</label>
                <select name="project_branch">
                    {% for value, label in branch_choices %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Date début</label>
                <input type="date" name="project_start_date" value="{{ today|date:'Y-m-d' }}">
            </div>
            <div class="form-group">
                <label>Date fin prévue</label>
                <input type="date" name="project_end_date" value="{{ today|date:'Y-m-d' }}">
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Description</label>
                <textarea name="project_description" placeholder="Objet du projet, livrables..."></textarea>
            </div>
        </div>
        <button type="submit" class="btn-crm btn-crm--primary">Créer le projet</button>
    </form>
</div>
{% endblock %}
